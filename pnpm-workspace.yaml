  "@ai-sdk/fal": "^3.0.48"
  "@ai-sdk/openai": "^4.0.74"
  "@ai-sdk/replicate": "^3.0.48"
  "@howells/envy": "^0.3.7"
  "@howells/husky": "^0.3.0"
  "@howells/lint": "^3.5.1"
  "@howells/typescript-config": "^0.1.8"
  "@tailwindcss/postcss": "^4.3.3"
  "@types/node": "^26.6.2"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitest/coverage-v8": "^5.0.1"
  "ai": "^7.0.113"
  "babel-plugin-react-compiler": "^1.0.0"
  "chalk": "^6.0.0"
  "commander": "^15.0.0"
  "husky": "^9.1.7"
  "ink": "^7.1.1"
  "ink-text-input": "^6.0.0"
  "lint-staged": "^17.5.1"
  "neverthrow": "^8.2.0"
  "next": "^16.4.1"
  "ora": "^9.4.1"
  "react": "^19.3.0"
  "react-devtools-core": "^8.0.0"
  "react-dom": "^19.3.0"
  "sharp": "0.35.5"
  "tailwindcss": "^4.3.3"
  "tsdown": "^0.23.0"
  "tsup": "^8.0.0"
  "tsx": "^4.23.15"
  "turbo": "2.11.3"
  "typescript": "7.0.2"
  "vite": "8.3.5"
  "vitest": "^5.0.1"
  "zod": "^4.6.7"


# Local Vercel builds also need the Linux runtime's native dependencies.
supportedArchitectures:
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc
  os:
    - current
    - linux

# One Node type package for the whole workspace. Blume's Astro and Vite 8 list
# @types/node as a peer and would otherwise resolve 22.x for sharp, which the
# CLI shares, and the type-aware lint then reads the wrong Node types.
overrides:
  "@types/node": "^26.6.2"
  # Transitive advisories whose parent pins a vulnerable version. Each entry
  # names the advisory and the parent to wait on; remove it once the parent moves.
  #   zod < 4.6.6 (GHSA-mrhx-c7xc-m3w5): @vercel/cli-config@0.3.1 pins zod 4.1.11, reached through @vercel/oidc 3.8.x
  #   path-to-regexp < 6.3.0: @vercel/routing-utils 6.6.1 pins 6.1.0
  #   glob <= 14.0.1 (GHSA-3g3m-2fjr-6pw4) and minimatch < 11.0.1 (GHSA-g3hv-75wg-m249): @vercel/nft 1.11.1 wants glob ^13
  #   postcss-selector-parser < 6.1.5 (GHSA-rj75-hqrm-r3gf): @tailwindcss/typography 0.5.20 pins 6.0.10
  #   esbuild < 0.28.1 (GHSA-g7r4-m6w7-qqqr): tsup 8.5.1 wants esbuild ^0.27.0
  "@vercel/cli-config>zod": "catalog:"
  "@vercel/routing-utils>path-to-regexp": "6.3.0"
  "@vercel/nft>glob": "^14.0.4"
  "@tailwindcss/typography>postcss-selector-parser": "^6.1.5"
  "tsup>esbuild": "^0.28.2"
